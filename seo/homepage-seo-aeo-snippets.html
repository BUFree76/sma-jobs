<!-- ---------------------------------------------------------------------
     1) ENRICHED ORGANIZATION SCHEMA
     ACTION: REPLACE the current Organization JSON-LD block on the homepage
     with this one. (The old one only had name/url/description and a broken
     "�" character.) This is the highest-value change for AI answer engines —
     logo + address + contactPoint + sameAs are how they confirm your identity.
     --------------------------------------------------------------------- -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "StaffMyAgency",
  "url": "https://staffmyagency.com/",
  "logo": "https://staffmyagency.com/Image/logo.png",
  "image": "https://staffmyagency.com/Image/logo.png",
  "description": "AI-powered, done-for-you recruiting for insurance agencies and small businesses — candidate screening, qualified shortlists, and human recruiting support. Based in Denton, Texas.",
  "email": "support@staffmyagency.com",
  "telephone": "+1-940-268-0971",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Denton",
    "addressRegion": "TX",
    "addressCountry": "US"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "+1-940-268-0971",
    "email": "support@staffmyagency.com",
    "contactType": "customer service",
    "areaServed": "US",
    "availableLanguage": "English"
  },
  "sameAs": [
    "https://www.linkedin.com/company/staffmyagency",
    "https://www.facebook.com/staffmyagencycom",
    "https://jobs.staffmyagency.com/"
  ]
}
</script>
<!-- Optional upgrade: if you add a full street address + ZIP, change
     "@type": "Organization" to "@type": "EmploymentAgency" for a stronger,
     more specific entity signal (it's a LocalBusiness subtype). -->


<!-- ---------------------------------------------------------------------

<meta property="og:image" content="https://staffmyagency.com/Image/logo.png" />

<!-- ---------------------------------------------------------------------
     3) HOMEPAGE FAQ SCHEMA
     ACTION: ADD this block to the homepage <head>. Ideally also render these
     same Q&As as visible text on the page (Google requires the FAQ content to
     be visible to the user to be eligible). You already do FAQ schema well on
     article pages — this brings it to the page brand/product queries land on.
     All answers confirmed with Jeff (Sep 2026); pricing links to the homepage
     #pricing section rather than hard-coding numbers that could drift.
     --------------------------------------------------------------------- -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What does StaffMyAgency do?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "StaffMyAgency is a done-for-you recruiting service for insurance agencies and small businesses. It uses AI to screen candidates sourced from job boards, then delivers a shortlist of qualified, vetted candidates — combining AI automation with hands-on human recruiting support."
      }
    },
    {
      "@type": "Question",
      "name": "How is StaffMyAgency different from a job board or an ATS?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A job board gives you a flood of raw applicants to sort yourself, and an ATS is software you still have to operate. StaffMyAgency does the work for you: it screens and scores applicants with AI and a recruiter delivers a shortlist of qualified candidates, so you review a handful of strong matches instead of hundreds of resumes."
      }
    },
    {
      "@type": "Question",
      "name": "How fast will I receive qualified candidates?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It depends on the role. StaffMyAgency's AI screens applicants continuously as they come in from job boards, so qualified candidates surface as soon as they apply rather than waiting on a manual review cycle. Total time to a strong shortlist varies with the position, local market, and applicant volume, so we don't quote a one-size-fits-all timeframe — your recruiter keeps you updated as vetted candidates come in."
      }
    },
    {
      "@type": "Question",
      "name": "Does StaffMyAgency specialize in insurance and financial services?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. StaffMyAgency focuses on the insurance and financial services niche — including State Farm, Farmers, Allstate, and independent insurance agencies, plus financial services firms — recruiting for sales, customer service, and office roles."
      }
    },
    {
      "@type": "Question",
      "name": "What roles does StaffMyAgency recruit for?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "StaffMyAgency focuses on the insurance and financial services niche. Common roles include licensed and unlicensed insurance sales representatives, customer service representatives, account managers, financial services staff, receptionists, and administrative/office roles."
      }
    },
    {
      "@type": "Question",
      "name": "How much does StaffMyAgency cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "StaffMyAgency offers simple, transparent monthly plans with no setup fee and no hidden fees. Agent plans start at $199/month. See current plans and everything included in the Pricing section on our homepage: https://staffmyagency.com/#pricing"
      }
    }
  ]
}
</script>
