<!-- ---------------------------------------------------------------------
     1) ENRICHED ORGANIZATION SCHEMA
     ACTION: REPLACE the current Organization JSON-LD block on the homepage
     with this one. (The old one only had name/url/description and a broken
     "�" character.) This is the highest-value change for AI answer engines —
     logo + address + contactPoint + sameAs are how they confirm your identity.
     --------------------------------------------------------------------- -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "StaffMyAgency",
  "url": "https://staffmyagency.com/",
  "logo": "https://staffmyagency.com/Image/logo.png",
  "image": "https://staffmyagency.com/Image/logo.png",
  "description": "AI-powered, done-for-you recruiting for insurance agencies and small businesses — candidate screening, qualified shortlists, and human recruiting support. Based in Denton, Texas.",
  "email": "support@staffmyagency.com",
  "telephone": "+1-940-268-0971",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Denton",
    "addressRegion": "TX",
    "addressCountry": "US"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "+1-940-268-0971",
    "email": "support@staffmyagency.com",
    "contactType": "customer service",
    "areaServed": "US",
    "availableLanguage": "English"
  },
  "sameAs": [
    "https://www.linkedin.com/company/staffmyagency",
    "https://www.facebook.com/staffmyagencycom",
    "https://jobs.staffmyagency.com/"
  ]
}
</script>
<!-- Optional upgrade: if you add a full street address + ZIP, change
     "@type": "Organization" to "@type": "EmploymentAgency" for a stronger,
     more specific entity signal (it's a LocalBusiness subtype). -->


<!-- ---------------------------------------------------------------------

      "name": "How much does StaffMyAgency cost?",

        "@type": "Answer",
